# Integration tests against the live services, one job per skill.
# Push: the skills whose <skill>/ or .ci/<skill>/ changed, all of them when shared CI files changed.
# Run workflow: all skills, or the one named. "Re-run failed jobs" reruns just the failed skills.
# Logs of a public repo are public: only test names and ok / not ok are printed, and every value
# pulled from Infisical is masked. Run a failing test locally to see why it failed.
name: integration
on:
  push:
  workflow_dispatch:
    inputs:
      skill:
        description: Skill to test (empty for all)
        required: false
        default: ''
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.pick.outputs.skills }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.skill }}
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          all=$(ls .ci/*/*.test.mjs | cut -d/ -f2 | sort -u)
          if [ -n "$INPUT" ]; then
            skills=$INPUT
          elif [ "$EVENT" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" HEAD)
            if grep -qE '^(\.ci/[^/]+|\.github/.*)$' <<<"$changed"; then
              skills=$all
            else
              skills=$(for s in $all; do if grep -qE "^(\.ci/)?$s/" <<<"$changed"; then echo "$s"; fi; done)
            fi
          else
            skills=$all
          fi
          # Each use of ovpay's offline token replaces it, so it stays on the machine that can also
          # log in again (emailed code); the runner never touches it.
          skills=$(grep -vx ovpay <<<"$skills" || true)
          echo "skills=$(jq -Rnc '[inputs | select(length > 0)]' <<<"$skills")" >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    if: needs.plan.outputs.skills != '[]'
    name: ${{ matrix.skill }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One run per skill at a time: tests share the live accounts (HTM's cart, for one)
    concurrency:
      group: integration-${{ matrix.skill }}
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJSON(needs.plan.outputs.skills) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g @infisical/cli@0.43.141
      - name: Pull secrets
        env:
          INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID }}
          INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET }}
        shell: bash
        run: |
          bash .ci/pull-secrets.sh
          for f in */.env */.*.env; do
            [ -f "$f" ] || continue
            while IFS= read -r line; do
              v=${line#*=}
              case $v in \'*\'|\"*\") v=${v:1:${#v}-2} ;; esac
              if [ -n "$v" ]; then echo "::add-mask::$v"; fi
            done < <(grep -E '^[^#=][^=]*=' "$f")
          done
      - name: Test
        env:
          SKILL: ${{ matrix.skill }}
        shell: bash
        run: node --test --test-reporter=tap .ci/"$SKILL"/*.test.mjs | grep -E '^ *(not )?ok '
